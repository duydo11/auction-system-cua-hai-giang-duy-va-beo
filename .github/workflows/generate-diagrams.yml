name: Generate Diagrams

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit generated images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure docs/images directory exists
        run: mkdir -p docs/images

      - name: Render PlantUML diagrams (SVG)
        # Sửa: Thêm -w /workspace và chỉnh lại đường dẫn -o cho chuẩn
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace plantuml/plantuml:latest -tsvg "docs/diagrams/*.puml" -o "../images"

      - name: Add and commit generated images
        # Mẹo nhỏ: Nên dùng v5 thay vì v4 vì GitHub Actions đã ngưng hỗ trợ Node.js 16 (v4 dùng Node 16)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(docs): update generated diagrams"
          file_pattern: docs/images/*.svg
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.ref_name }}

      - name: Done
        run: echo "Diagrams generated and committed."