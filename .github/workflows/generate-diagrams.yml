name: Generate Diagrams

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit generated images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure docs/images directory exists
        run: mkdir -p docs/images

      - name: Render PlantUML diagrams (SVG)
        # use plantuml Docker image to render .puml to SVG into docs/images
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" plantuml/plantuml:latest -tsvg -o docs/images docs/diagrams/*.puml
        # If you prefer png: replace -tsvg with -tpng

      - name: Add and commit generated images
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(docs): update generated diagrams"
          file_pattern: docs/images/*.svg
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.ref_name }}
          # If you want to push to a separate branch, set branch accordingly

      - name: Done
        run: echo "Diagrams generated and committed."