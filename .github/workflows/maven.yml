name: Java CI/CD Pipeline with Maven

# Kích hoạt con Bot chạy khi có người Push hoặc tạo Pull Request vào nhánh 'develop' hoặc 'main'
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Bật một máy ảo Linux

    steps:
      - name: Checkout code (Tải code từ GitHub về máy ảo)
        uses: actions/checkout@v3

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21' # ĐÃ SỬA THÀNH 21 Ở ĐÂY
          distribution: 'temurin'
          cache: maven # Lưu cache để lần sau chạy nhanh hơn

      - name: Chạy kiểm tra và Biên dịch toàn bộ dự án
        # Lệnh này sẽ build cả module shared, server, client. Nếu lỗi cú pháp, ngoặc nhọn, hay thiếu file POM, nó sẽ đánh dấu đỏ (X)
        run: mvn clean compile

      - name: Chạy Unit Test (Nếu có)
        run: mvn test