name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [ "main", "develop","donluy", "hoan", "giang" ]
  pull_request:
    branches: [ "main", "develop","donluy", "hoan", "giang" ]

jobs:
  build-and-test:
    # Thiết lập ma trận chạy song song
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # Sử dụng biến matrix để chọn hệ điều hành
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Cập nhật lên v4 mới nhất

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v4 # Cập nhật lên v4 mới nhất
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Chạy kiểm tra và Biên dịch toàn bộ dự án
        # Trên Windows, lệnh mvn vẫn chạy bình thường trong shell mặc định của GitHub Actions
        run: mvn clean compile

      - name: Chạy Unit Test
        run: mvn test